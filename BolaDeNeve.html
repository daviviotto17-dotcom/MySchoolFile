<html><head><script>
    // 1. BLOQUEAR ZOOM POR GESTOS (Pinch-to-zoom / Pinça com dois dedos no mobile)
    document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) {
            e.preventDefault(); // Impede o zoom se houver mais de 1 dedo na tela
        }
    }, { passive: false });

    // Bloquear duplo clique rápido no mobile (que às vezes dá zoom automático)
    let ultimoToque = 0;
    document.addEventListener('touchend', function(e) {
        let agora = (new Date()).getTime();
        if (agora - ultimoToque <= 300) {
            e.preventDefault();
        }
        ultimoToque = agora;
    }, false);


    // 2. BLOQUEAR ZOOM NO PC (Teclado e Roda do Rato)
    // Bloqueia Ctrl + Roda do Rato (Scroll)
    document.addEventListener('wheel', function(e) {
        if (e.ctrlKey) {
            e.preventDefault();
        }
    }, { passive: false });

    // Bloqueia as teclas de atalho de Zoom (Ctrl +, Ctrl -, Ctrl 0)
    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && (
            e.key === '+' || 
            e.key === '-' || 
            e.key === '=' || 
            e.key === '0' || 
            e.keyCode === 107 || // Numpad +
            e.keyCode === 109 || // Numpad -
            e.keyCode === 96     // Numpad 0
        )) {
            e.preventDefault();
        }
    });


    // 3. BLOQUEAR ARRASTAR A PÁGINA (Scroll / Efeito Elástico no Mobile)
    document.addEventListener('touchmove', function(e) {
        // Se a tela cheia estiver ativa, impede qualquer tentativa de arrastar o fundo
        e.preventDefault(); 
    }, { passive: false });


    // 4. BLOQUEAR ARRASTAR ELEMENTOS (Impedir o utilizador de clicar e arrastar imagens ou o canvas)
    document.addEventListener('dragstart', function(e) {
        e.preventDefault();
    });
</script>

<div id="overlay" style="
  position:fixed;
  top:0; left:0;
  width:100vw; height:100vh;
  background:rgba(0,0,0,0.9);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  cursor:pointer;
  color:#fff;
  font-size:2em;
  font-family:sans-serif;
  text-align:center;
">
  Clique para jogar em tela cheia
</div>

<script>
  const overlay = document.getElementById("overlay");

  function enterFullscreen() {
    let elem = document.documentElement;
    if (elem.requestFullscreen) elem.requestFullscreen();
    else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
    else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
  }

  overlay.addEventListener("click", () => {
    overlay.style.display = "none";
    enterFullscreen();
  });

  document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement) {
      overlay.style.display = "flex";
    }
  });
</script>
