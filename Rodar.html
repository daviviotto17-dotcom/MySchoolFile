javascript:document.body.innerHTML = `
<div style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;background:white;padding:20px;">
    <h3>Insert Code:</h3>
    <textarea id="meuCodigo" style="width:100%;height:70%;font-size:10px;"></textarea><br>
    <button id="rodar" style="font-size:20px;padding:10px;width:100%;">RODARO</button>
</div>`;

document.getElementById('rodar').onclick = function() {
    var html = document.getElementById('meuCodigo').value;
    document.open();
    document.write(html);
    document.close();
};
